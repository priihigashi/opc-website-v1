<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Selected Projects · Oak Park Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#1b1a13;--obsidian:#141309;--cream:#F0EBE3;--lime:#CBCC10;--lime-glow:rgba(203,204,16,.4);--walnut:#8B5A2B;--line:rgba(240,235,227,.12);--muted:rgba(240,235,227,.6);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--cream);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}

/* ---------- NAV ---------- */
nav.top{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:18px 38px;background:rgba(20,19,9,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
nav.top .brand{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.5px;text-transform:uppercase;line-height:1;}
nav.top .brand .lime{color:var(--lime);}
nav.top .links{display:flex;gap:26px;}
nav.top .links a{font-family:'Roboto Mono',monospace;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);transition:color .25s;}
nav.top .links a:hover{color:var(--lime);}

/* ---------- TOP BAR ---------- */
.wrap{padding:150px 38px 0;}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:24px;padding-bottom:34px;border-bottom:1px solid var(--line);}
.eyebrow{font-family:'Roboto Mono',monospace;font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--lime);margin-bottom:16px;}
.topbar h1{font-family:'Anton',sans-serif;font-size:clamp(40px,6vw,76px);letter-spacing:.5px;line-height:1;text-transform:uppercase;}
.topbar h1 .serif{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--lime);text-transform:none;letter-spacing:0;}
.barside{display:flex;flex-direction:column;align-items:flex-end;gap:18px;}
.count{font-family:'Roboto Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--cream);}
.count b{color:var(--lime);font-weight:500;}
.toggle{display:flex;gap:8px;}
.toggle button{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;border-radius:40px;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);transition:all .25s;}
.toggle button:hover{color:var(--cream);border-color:var(--muted);}
.toggle button.active{background:var(--lime);color:var(--obsidian);border-color:var(--lime);font-weight:500;}

/* ---------- SHARED PROJECT TINT ---------- */
.proj-img{filter:brightness(.85) saturate(.78) contrast(.86);transition:filter .5s ease,transform .5s ease;}

/* ============ LIST MODE ============ */
.projects{margin-top:6px;}
.mode-list .grid-card{display:none;}
.mode-list .row{display:grid;}

.row{position:relative;grid-template-columns:64px minmax(0,1.7fr) 1.1fr 1.2fr 40px;align-items:center;gap:24px;padding:30px 14px;border-bottom:1px solid var(--line);transition:transform .4s cubic-bezier(.22,1,.36,1);}
.row .r-index{font-family:'Roboto Mono',monospace;font-size:14px;letter-spacing:1px;color:var(--lime);}
.row .r-title{font-family:'Anton',sans-serif;font-size:clamp(22px,2.6vw,34px);letter-spacing:.5px;line-height:1;text-transform:uppercase;transition:color .35s;}
.row .r-meta{font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.row .r-tags{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.row .r-arrow{justify-self:end;font-size:26px;color:var(--cream);will-change:transform;animation:bob 1.8s ease-in-out infinite;}
.row .r-thumb{display:none;}

/* hover preview image */
.row .preview{position:absolute;top:50%;right:64px;transform:translateY(-50%) translateX(20px) scale(.92);width:280px;height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 30px var(--lime-glow);opacity:0;pointer-events:none;z-index:5;transition:opacity .4s ease,transform .5s cubic-bezier(.22,1,.36,1);}

.row:hover{transform:translateX(14px);}
.row:hover .r-title{color:var(--lime);}
.row:hover .preview{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
.row:hover .preview.proj-img{filter:brightness(1) saturate(.9) contrast(.95);}
.row:hover .r-arrow{transform:translateX(8px);color:var(--lime);}

@keyframes bob{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}

/* ============ GRID MODE ============ */
.mode-grid .projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-top:34px;}
.mode-grid .row{display:none;}
.mode-grid .grid-card{display:block;}

.grid-card{background:var(--obsidian);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;}
.grid-card .gc-imgwrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px 10px 0 0;}
.grid-card .gc-imgwrap img{width:100%;height:100%;object-fit:cover;border-radius:10px 10px 0 0;}
.grid-card .gc-body{padding:18px 18px 22px;}
.grid-card .gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.grid-card .gc-index{font-family:'Roboto Mono',monospace;font-size:13px;letter-spacing:1px;color:var(--lime);}
.grid-card .gc-arrow{font-size:22px;color:var(--cream);transition:transform .35s,color .35s;}
.grid-card .gc-title{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.5px;line-height:1.02;text-transform:uppercase;margin-bottom:10px;transition:color .35s;}
.grid-card .gc-meta{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;line-height:1.7;}
.grid-card:hover{transform:translateY(-4px);border-color:rgba(203,204,16,.35);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 24px var(--lime-glow);}
.grid-card:hover .gc-imgwrap img.proj-img{transform:scale(1.05);filter:brightness(1) saturate(.9) contrast(.95);}
.grid-card:hover .gc-title{color:var(--lime);}
.grid-card:hover .gc-arrow{transform:translateX(6px);color:var(--lime);}

/* ---------- FOOTER ---------- */
footer{margin-top:80px;padding:34px 38px;border-top:1px solid var(--line);font-family:'Roboto Mono',monospace;font-size:11.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}

/* ---------- MOBILE ---------- */
@media (max-width:900px){
  nav.top .links{display:none;}
  .wrap{padding:128px 18px 0;}
  .topbar{flex-direction:column;align-items:flex-start;}
  .barside{align-items:flex-start;}
  .row{grid-template-columns:44px minmax(0,1fr) 64px;gap:14px;padding:18px 6px;}
  .row:hover{transform:none;}
  .row .r-meta{display:none;}
  .row .r-tags{display:none;}
  .row .preview{display:none;}
  .row .r-arrow{animation:none;font-size:20px;}
  .row .r-thumb{display:block;width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);justify-self:end;}
  .row .r-title{font-size:20px;}
  .mode-grid .projects{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion: reduce){
  .row .r-arrow{animation:none;}
  *{transition-duration:.001ms!important;}
}
</style>
<script src="assets/js/lab-banner.js?v=19" defer></script>
<link rel="stylesheet" href="assets/css/opc-shared.css">
</head>
<body>

<nav class="top">
  <a href="index.html" class="brand">OAK PARK <span class="lime">CONSTRUCTION</span></a>
  <div class="links"><a href="index.html">Home</a><a href="gallery-showcase.html">Our Work</a><a href="about.html">About</a><a href="how-it-works.html">How We Work</a><a href="contact.html">Contact</a></div>
</nav>

<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow">Our Work</div>
      <h1>Selected <span class="serif">projects.</span></h1>
    </div>
    <div class="barside">
      <div class="count"><b>120+</b> PROJECTS</div>
      <div class="toggle">
        <button id="btn-list" class="active" type="button">List</button>
        <button id="btn-grid" type="button">Grid</button>
      </div>
    </div>
  </div>

  <div id="container" class="mode-list">
    <div class="projects" id="projects"></div>
  </div>

  <footer>© 2026 Oak Park Construction · Projects List v2 (referenzen-pattern test) · (954) 258-6769</footer>
</div>

<script>
const PROJECTS = [
  {idx:"01",code:"CS01",title:"Dockside Waterfront Home",loc:"Fort Lauderdale, Broward",svc:"New Construction",img:"assets/img/mike/new-construction/122-dockside-cir-IMG_7853.jpeg"},
  {idx:"02",code:"CS02",title:"Rio Vista Foundation & Slab",loc:"Fort Lauderdale, Broward",svc:"Concrete",img:"assets/img/mike/concrete-work/2112-rio-vista--IMG_3721.jpeg"},
  {idx:"03",code:"CS03",title:"Harbor Ct Deck & Patio",loc:"Broward",svc:"Decks & Patios",img:"assets/img/mike/exterior-patio-builds/1270-harbor-ct-IMG_3370.jpeg"},
  {idx:"04",code:"CS04",title:"Clark Pergola & Outdoor Living",loc:"Broward",svc:"Outdoor Living",img:"assets/img/mike/exterior-patio-builds/clark-pergola-IMG_0020.jpeg"},
  {idx:"05",code:"CS05",title:"Full Kitchen Remodel",loc:"Palm Beach",svc:"Kitchens",img:"assets/img/mike/kitchens/IMG_2877.jpeg"},
  {idx:"06",code:"CS06",title:"Master Bath Renovation",loc:"Broward",svc:"Bathrooms",img:"assets/img/mike/bathrooms/IMG_2873.jpeg"},
  {idx:"07",code:"CS07",title:"Second-Story Addition",loc:"Miami-Dade",svc:"Additions",img:"assets/img/mike/shell-construction/IMG_5462.jpeg"},
  {idx:"08",code:"CS08",title:"Whole-Home Renovation",loc:"Broward",svc:"Full Renovation",img:"assets/img/gallery/remodel-b.jpg"},
  {idx:"09",code:"CS09",title:"Custom New Build",loc:"Broward",svc:"New Construction",img:"assets/img/gallery/newbuild-b.jpg"}
];

const LINK = "gallery-showcase.html";

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildProjects(){
  const host = document.getElementById('projects');
  let html = "";
  PROJECTS.forEach(p=>{
    // LIST ROW
    html += `<a class="row" href="${LINK}" aria-label="${esc(p.title)}">
      <span class="r-index">${p.idx}</span>
      <span class="r-title">${esc(p.title)}</span>
      <span class="r-meta">${esc(p.loc)}</span>
      <span class="r-tags">${esc(p.svc)}</span>
      <img class="r-thumb proj-img" src="${p.img}" alt="${esc(p.title)}" loading="lazy">
      <span class="r-arrow">→</span>
      <img class="preview proj-img" src="${p.img}" alt="${esc(p.title)} preview" loading="lazy">
    </a>`;
    // GRID CARD
    html += `<a class="grid-card" href="${LINK}" aria-label="${esc(p.title)}">
      <div class="gc-imgwrap"><img class="proj-img" src="${p.img}" alt="${esc(p.title)}" loading="lazy"></div>
      <div class="gc-body">
        <div class="gc-top"><span class="gc-index">${p.idx} · ${p.code}</span><span class="gc-arrow">→</span></div>
        <div class="gc-title">${esc(p.title)}</div>
        <div class="gc-meta">${esc(p.loc)}<br>${esc(p.svc)}</div>
      </div>
    </a>`;
  });
  host.innerHTML = html;
}

function initToggle(){
  const container = document.getElementById('container');
  const btnList = document.getElementById('btn-list');
  const btnGrid = document.getElementById('btn-grid');
  btnList.addEventListener('click', ()=>{
    container.classList.remove('mode-grid');
    container.classList.add('mode-list');
    btnList.classList.add('active');
    btnGrid.classList.remove('active');
  });
  btnGrid.addEventListener('click', ()=>{
    container.classList.remove('mode-list');
    container.classList.add('mode-grid');
    btnGrid.classList.add('active');
    btnList.classList.remove('active');
  });
}

buildProjects();
initToggle();
</script>
</body>
</html>
