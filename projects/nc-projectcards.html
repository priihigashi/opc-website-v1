document.querySelectorAll('.proj').forEach(function(p){
  var ims=[].slice.call(p.querySelectorAll('.pstage img')), dots=[].slice.call(p.querySelectorAll('.pdots span')), cur=p.querySelector('.cur'), i=0;
  function show(n){ims[i].classList.remove('on');dots[i].classList.remove('on');i=(n+ims.length)%ims.length;ims[i].classList.add('on');dots[i].classList.add('on');cur.textContent=i+1;}
