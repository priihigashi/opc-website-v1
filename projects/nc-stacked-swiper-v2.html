function mk(sel,p,n){var sw=new Swiper(sel,{slidesPerView:'auto',centeredSlides:true,spaceBetween:48,grabCursor:true,loop:true,speed:750,watchSlidesProgress:true,navigation:{prevEl:p,nextEl:n}});
function fx(){sw.slides.forEach(function(s){var pr=Math.max(-2,Math.min(2,s.progress||0));var a=Math.min(1,Math.abs(pr));s.style.transform='scale('+(1-a*0.34).toFixed(3)+')';s.style.opacity=(1-a*0.5).toFixed(3);var im=s.querySelector('.ps-img');if(im)im.style.transform='translateX('+(pr*8)+'%)';});}
sw.on('progress',fx);sw.on('setTranslate',fx);sw.on('setTransition',function(s,d){sw.slides.forEach(function(sl){sl.style.transitionProperty='transform,opacity';sl.style.transitionDuration=d+'ms';sl.style.transitionTimingFunction='cubic-bezier(.22,1,.36,1)';});});fx();}
mk('.sw-a','.p-a','.n-a');mk('.sw-b','.p-b','.n-b');</script></body></html>
