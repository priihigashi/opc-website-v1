<title>OPC — New Construction · House 3D (Ricardo fork, OPC recolor)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../assets/js/lab-banner.js?v=13" defer></script>
<style>
  :root {
    --black:#050505; --obsidian:#0A0A0A; --cream:#F0EBE3; --lime:#CBCC10;
    --lime-glow:rgba(203,204,16,0.4); --walnut:#8B5A2B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--black); color:var(--cream); font-family:'Inter',system-ui,sans-serif; overflow-x:hidden; scroll-behavior:smooth; }
  a { color:inherit; text-decoration:none; }
  .serif { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; }

  /* ambient */
  .ambient { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .ambient .glow { position:absolute; width:110vw; height:110vw; max-width:1300px; max-height:1300px; top:46%; left:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(203,204,16,0.04) 0%, rgba(203,204,16,0.012) 26%, transparent 56%);
    filter:blur(80px); }

  /* nav */
  nav.site-nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:24px 48px;
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg, rgba(5,5,5,0.75), transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .logo { font-family:'Anton',sans-serif; font-size:14px; letter-spacing:3px; color:var(--cream); }
  .logo .lime { color:var(--lime); }
  .nav-links { display:flex; gap:28px; align-items:center; }
  .nav-links a { font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.72; }
  .nav-links a:hover { opacity:1; color:var(--lime); }
  .nav-cta { padding:8px 18px; border:1px solid var(--lime); border-radius:999px; color:var(--lime)!important; opacity:1!important; }
  .nav-cta:hover { background:var(--lime); color:var(--obsidian)!important; }

  /* hero */
  main { position:relative; z-index:2; }
  section.hero { min-height:100vh; padding:120px 48px 60px 96px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:40px; align-items:center; }
  .hero-text { max-width:560px; align-self:center; }
  .eyebrow { font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:4px; color:var(--lime); margin-bottom:22px; }
  .hero h1 { font-family:'Anton',sans-serif; font-size:clamp(50px,8vw,108px); line-height:0.92; text-transform:uppercase; }
  .hero h1 .serif { color:var(--lime); text-transform:none; font-size:1.4em; letter-spacing:-1px; }
  .hero p { margin-top:24px; font-family:'Roboto Mono',monospace; font-size:13px; letter-spacing:1px; line-height:1.7; max-width:480px; opacity:0.75; }
  .hero-cta { display:inline-flex; align-items:center; gap:10px; margin-top:30px; padding:14px 28px; border:1px solid var(--lime);
    border-radius:999px; color:var(--lime); background:rgba(240,235,227,0.04); backdrop-filter:blur(20px) saturate(140%);
    font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; transition:all 0.25s; }
  .hero-cta:hover { background:var(--lime); color:var(--obsidian); box-shadow:0 0 28px var(--lime-glow); }

  /* 3D house stage (Ricardo Oliva Alonso fork — yLOpNdZ — recolored to OPC palette) */
  .house-wrap { position:relative; width:100%; height:100%; min-height:62vh; display:flex; align-items:center; justify-content:center; }
  .stage-tag { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:2.5px; color:rgba(240,235,227,0.5); text-transform:uppercase; }
  .stage-tag .lime { color:var(--lime); }

  @media (max-width:900px) {
    nav.site-nav { padding:18px 20px; }
    .nav-links a:not(.nav-cta) { display:none; }
    section.hero { grid-template-columns:1fr; padding:110px 20px 40px; }
    .house { width:74vw!important; height:50vw!important; }
  }
