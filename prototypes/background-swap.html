<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Background Swap — OPC Prototype</title>
<link rel="icon" href="/opc-website-v1/favicon.svg" type="image/svg+xml">
<script src="../assets/js/lab-banner.js?v=15" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
:root{--obsidian:#0A0A0A;--cream:#F0EBE3;--lime:#CBCC10}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#000;color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.hero{min-height:100vh;display:grid;align-items:end;padding:8vw;position:relative;isolation:isolate}.bg{position:absolute;inset:0;background-image:var(--bg);background-size:cover;background-position:center;filter:brightness(.48) saturate(.88);transform:scale(1.03);transition:background-image .35s,filter .45s,transform .7s;z-index:-3}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.88),rgba(10,10,10,.28),rgba(10,10,10,.82));z-index:-2}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(203,204,16,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(203,204,16,.09) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(90deg,#000,transparent 70%);z-index:-1}
.eyebrow{font:11px/1 Roboto Mono,monospace;color:var(--lime);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px}h1{font-family:Anton,sans-serif;font-size:clamp(58px,10vw,146px);line-height:.88;text-transform:uppercase;max-width:900px}.serif{font-family:"Cormorant Garamond",serif;text-transform:none;color:var(--lime);font-size:.78em}.copy{max-width:980px}.lead{max-width:520px;margin-top:22px;color:rgba(240,235,227,.75);line-height:1.65}.choices{position:absolute;right:42px;bottom:42px;display:grid;grid-template-columns:repeat(2,120px);gap:12px}.choice{height:92px;border:1px solid rgba(240,235,227,.35);background-image:var(--thumb);background-size:cover;background-position:center;border-radius:18px;cursor:pointer;position:relative;overflow:hidden;transition:.25s}.choice:after{content:attr(data-label);position:absolute;inset:auto 0 0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.86));font:9px/1 Roboto Mono,monospace;letter-spacing:1.3px;text-transform:uppercase}.choice.active{border-color:var(--lime);box-shadow:0 0 0 2px rgba(203,204,16,.28),0 0 40px rgba(203,204,16,.25);transform:translateY(-3px)}
@media(max-width:820px){body{overflow:auto}.hero{padding:120px 22px 220px}.choices{left:22px;right:22px;bottom:24px;grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="hero" id="hero" style="--bg:url('../assets/img/mike/new-construction/122-dockside-cir-IMG_7853.jpeg')">
  <div class="bg"></div><div class="grid"></div>
  <section class="copy">
    <div class="eyebrow">BG-Swap Component · 14</div>
    <h1>Choose the<br><span class="serif">project mood</span><br>before you scroll.</h1>
    <p class="lead">A hero/services/process candidate: four square choices let the visitor switch the page atmosphere between real OPC project categories.</p>
  </section>
  <nav class="choices" aria-label="Project background choices">
    <button class="choice active" data-label="New Build" style="--thumb:url('../assets/img/mike/new-construction/122-dockside-cir-IMG_7853.jpeg')" data-bg="url('../assets/img/mike/new-construction/122-dockside-cir-IMG_7853.jpeg')"></button>
    <button class="choice" data-label="Kitchen" style="--thumb:url('../assets/img/mike/kitchens/IMG_2837.jpeg')" data-bg="url('../assets/img/mike/kitchens/IMG_2837.jpeg')"></button>
    <button class="choice" data-label="Outdoor" style="--thumb:url('../assets/img/mike/exterior-patio-builds/clark-pergola-IMG_1194.JPG')" data-bg="url('../assets/img/mike/exterior-patio-builds/clark-pergola-IMG_1194.JPG')"></button>
    <button class="choice" data-label="Bath" style="--thumb:url('../assets/img/mike/bathrooms/IMG_2874.jpeg')" data-bg="url('../assets/img/mike/bathrooms/IMG_2874.jpeg')"></button>
  </nav>
</main>
<script>
const hero=document.getElementById('hero');
document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  hero.style.setProperty('--bg',btn.dataset.bg);
}));
</script>
</body>
</html>
